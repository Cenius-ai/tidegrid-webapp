[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidegrid"
version = "1.0.0"
description = "Tidal harmonic constant editor with high/low water predictions and tide-table export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
tidegrid = "tidegrid:main"

[tool.setuptools]
py-modules = ["tidegrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Tidegrid works in station-LOCAL naive datetimes by design: the station file carries
# timezone_offset_minutes and hours_since_epoch() applies it explicitly, so there are no
# aware/naive comparisons to get wrong. The tests assert returncode themselves, and the
# module is invoked through its console script, so the shebang need not be executable.
ignore = ["DTZ001", "DTZ007", "PLW1510", "EXE001"]
